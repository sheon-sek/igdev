name: igdev-gateway-e2e

# The non-hermetic tier: one real container engine, one real Ignition image, the
# whole Gateway lifecycle — `up`, `wait`, `smoke`, `down --volumes`. The PR suite
# stays hermetic (a PATH-shimmed docker and a loopback Gateway stand-in); an
# Ignition image is pulled here and nowhere else, so this job is dispatched or
# scheduled, never a required check.
#
# Consent is a human act (ADR 0004): the client below records the EULA acceptance
# with `setup --accept-eula`, which is the person who dispatched this workflow
# accepting the terms for this machine. No step reads the admin password; nothing
# secret is ever printed.

on:
  workflow_dispatch:
    inputs:
      ignition_version:
        description: Ignition version to boot
        required: true
        default: "8.3.8"
      wait_timeout:
        description: Seconds `igdev gateway wait` may take for health
        required: true
        default: "420"
  schedule:
    # Nightly, so a moved base image or a changed Docker API surfaces without a
    # person dispatching anything.
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  gateway-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IGNITION_VERSION: ${{ github.event.inputs.ignition_version || '8.3.8' }}
      WAIT_TIMEOUT: ${{ github.event.inputs.wait_timeout || '420' }}
      CHECKOUT: ${{ github.workspace }}/e2e-checkout
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build igdev
        run: |
          go build -trimpath -o "$RUNNER_TEMP/igdev" ./cmd/igdev
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Report the engine
        run: |
          docker version
          docker compose version

      - name: Materialize a checkout
        run: |
          mkdir -p "$CHECKOUT"
          cd "$CHECKOUT"
          igdev init \
            --name igdev-e2e \
            --ignition-version "$IGNITION_VERSION" \
            --gateway-timezone UTC \
            --gateway-memory-mb 2048 \
            --json
          igdev setup --accept-eula --json

      - name: Boot the Gateway and drive its lifecycle
        working-directory: ${{ env.CHECKOUT }}
        run: |
          igdev gateway up --json
          igdev gateway wait --timeout "$WAIT_TIMEOUT" --json
          igdev gateway smoke --json
          igdev gateway status
          igdev gateway url

      # Phase 1 (ADR 0007, 0008): the seeded Instance token answers at the first
      # RUNNING, the trial is readable, a live trial is not reset, the keeper runs
      # beside the Gateway, and a person can still reach the login page (#69).
      # Expiry itself is not exercised: it takes two hours.
      - name: Assert the seeded token, the trial, and the login page
        working-directory: ${{ env.CHECKOUT }}
        run: |
          set -euo pipefail
          url="$(igdev gateway status --json | jq -r '.data.url')"
          token="$(igdev gateway credentials --json | jq -r '.data.api_token')"
          echo "::add-mask::$token"

          code="$(curl -s -o /dev/null -w '%{http_code}' -H "X-Ignition-API-Token: $token" "$url/data/api/v1/gateway-info")"
          [ "$code" = 200 ] || { echo "gateway-info with the token answered $code, want 200"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' "$url/data/api/v1/gateway-info")"
          [ "$code" = 401 ] || { echo "gateway-info without a token answered $code, want 401"; exit 1; }

          trial="$(igdev gateway trial --json)"
          echo "$trial" | jq -e '.data.trial.license_mode == "Trial" and .data.trial.expired == false' >/dev/null \
            || { echo "unexpected trial state: $trial"; exit 1; }
          reset="$(igdev gateway trial reset --json)"
          echo "$reset" | jq -e '.ok == true and .data.reset == false' >/dev/null \
            || { echo "a live trial was not left alone: $reset"; exit 1; }

          igdev gateway status --json \
            | jq -e '[.data.services[] | select(.service == "trial-keeper" and .state == "running")] | length == 1' >/dev/null \
            || { echo "the trial-keeper service is not running"; exit 1; }

          # The login route redirects to the system identity provider; a seed that
          # names a provider the Gateway lacks answers 500 here.
          location="$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$url/data/app/login")"
          case "$location" in
            "302 $url/idp/temp/"*) ;;
            *) echo "the login route answered '$location', want a redirect to /idp/temp/"; exit 1 ;;
          esac

      # Phase 2 (#46): staged modules no longer hide the image's own, so a
      # checkout with nothing staged and no whitelist runs every built-in module.
      - name: Assert the built-in modules load
        working-directory: ${{ env.CHECKOUT }}
        run: |
          set -euo pipefail
          url="$(igdev gateway status --json | jq -r '.data.url')"
          token="$(igdev gateway credentials --json | jq -r '.data.api_token')"
          echo "::add-mask::$token"
          modules="$(curl -fsS -H "X-Ignition-API-Token: $token" "$url/data/api/v1/modules/healthy")"
          echo "$modules" | jq -e '[.items[].id] | index("com.inductiveautomation.opcua") != null' >/dev/null \
            || { echo "the OPC UA module is not running: $(echo "$modules" | jq -c '[.items[].id]')"; exit 1; }
          igdev gateway status --json | jq -e '.data.host_address == "host.docker.internal" and (.data.container | endswith("-gateway-1"))' >/dev/null \
            || { echo "gateway status does not report the container and host address"; exit 1; }

      # Phase 3 (#49, #31): reach inside through igdev, never raw docker. The
      # engineering-tools proof places a marker and reads a report this way; the
      # host check proves host.docker.internal (#48) from inside the Gateway.
      - name: Assert exec, data put/get, and the host address
        working-directory: ${{ env.CHECKOUT }}
        run: |
          set -euo pipefail
          igdev gateway exec -- ls /usr/local/bin/ignition/data | grep -x config >/dev/null \
            || { echo "gateway exec did not list the data directory"; exit 1; }
          echo "run" > marker.once
          igdev gateway data put marker.once engineering-tools/proof/run-udt-sdk-proof.once --json \
            | jq -e '.ok and .data.bytes == 4' >/dev/null
          igdev gateway exec -- stat -c '%u:%g' /usr/local/bin/ignition/data/engineering-tools/proof/run-udt-sdk-proof.once \
            | grep -x '2003:0' >/dev/null || { echo "the put file is not owned by the Gateway"; exit 1; }
          igdev gateway data get engineering-tools/proof/run-udt-sdk-proof.once back.once
          cmp marker.once back.once
          code=0; igdev gateway data get ../etc/passwd --json >/dev/null || code=$?
          [ "$code" = 2 ] || { echo "a .. path was not refused as usage (exit $code)"; exit 1; }

          python3 -m http.server 18777 --bind 0.0.0.0 >/dev/null 2>&1 &
          server=$!
          for _ in 1 2 3 4 5; do curl -fs -o /dev/null http://127.0.0.1:18777/ && break; sleep 1; done
          status="$(igdev gateway exec -- curl -s -o /dev/null -w '%{http_code}' http://host.docker.internal:18777/ || true)"
          kill "$server"
          [ "$status" = 200 ] || { echo "the Gateway could not reach the host (got '$status')"; exit 1; }

      - name: Collect diagnostics on failure
        if: failure()
        working-directory: ${{ env.CHECKOUT }}
        run: |
          igdev gateway status --json > gateway-status.json 2>&1 || true
          igdev gateway logs --tail 500 > gateway-logs.txt 2>&1 || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: igdev-gateway-e2e-logs
          path: |
            ${{ env.CHECKOUT }}/gateway-logs.txt
            ${{ env.CHECKOUT }}/gateway-status.json
          if-no-files-found: ignore

      - name: Stop the Gateway
        if: always()
        working-directory: ${{ env.CHECKOUT }}
        run: igdev gateway down --volumes || true
