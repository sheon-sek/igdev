# igdev Project Contract (schema 1).
#
# Written by `igdev init`; every igdev write prints a unified diff, so tracked
# changes stay reviewable. Hand-editing this file makes the Checkout Setup stale:
# run `igdev setup` afterwards.

schema = 1

[project]
name = "igdev"

[ignition]
version = "8.3.8"
jython_version = "2.7.4"
edition = "standard"

[modules]
enabled = ["com.inductiveautomation.perspective", "com.inductiveautomation.historian", "com.inductiveautomation.opcua", "com.inductiveautomation.webdev"]

[scan]
jython = []
capabilities = []

[commands]
check = "make fmt-check vet"
test = "make test"
build = "make build"

[gateway]
memory_mb = 2048
timezone = "Asia/Kuala_Lumpur"
